name: Windows VST3 Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DGARASI_BUILD_TESTS=ON
      - name: Compile
        shell: pwsh
        run: cmake --build build --config Release --parallel 4
      - name: Test DSP
        shell: pwsh
        run: ctest --test-dir build --config Release --output-on-failure
      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Filter '*.vst3' -Recurse -Directory | Select-Object -First 1
          if (-not $plugin) { throw 'No VST3 bundle produced' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $plugin.FullName -Destination (Join-Path dist $plugin.Name) -Recurse
          Compress-Archive -Path (Join-Path dist '*.vst3') -DestinationPath dist/GarasiAmp-Windows-x64-VST3.zip -Force
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: GarasiAmp-Windows-x64-VST3
          path: dist/GarasiAmp-Windows-x64-VST3.zip
